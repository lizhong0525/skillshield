[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillshield"
version = "0.1.0"
description = "Static security scanner for AI-agent skill folders"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

[project.scripts]
skillshield = "skillshield.cli:main"

[tool.setuptools]
packages = ["skillshield"]
